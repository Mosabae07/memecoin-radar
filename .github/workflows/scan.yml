name: scan

# Runs in "shifts": each run scans every 15 minutes for about 5.5 hours, then starts the next shift itself.
# GitHub's own scheduler can be slow or skip runs on new repos, so the shifts keep the radar going 24/7;
# the hourly schedule below only restarts things if a shift ever dies.
on:
  schedule:
    - cron: '7 * * * *'      # safety net: restarts the shift chain if it ever stops
  workflow_dispatch: {}      # "Run workflow" button, and how each shift starts the next
  push:                      # code changes start a scan straight away (the bot's own data commits don't trigger this)
    branches: [main]
    paths-ignore: ['docs/data/**', '**.md']

permissions:
  contents: write            # save scan results
  actions: write             # start the next shift

concurrency:
  group: scan                # only one shift at a time; extra triggers wait their turn
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the rules
        run: node --test tests/*.test.mjs

      - name: Scan every 15 minutes for about 5.5 hours
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          end=$((SECONDS + 5*3600 + 30*60))
          while :; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true   # picks up code changes mid-shift
            node radar/scan.mjs || echo "::warning::scan failed, retrying next round"
            git add docs/data
            if ! git diff --cached --quiet; then
              git commit -q -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && break; sleep 5; done
            fi
            [ "$SECONDS" -ge "$end" ] && break
            sleep 840
          done

      - name: Start the next shift
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --ref "${GITHUB_REF_NAME}"
